# Netlify Configuration for AJMart Frontend

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback: Route all non-asset requests to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for immutable production assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images cache
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
